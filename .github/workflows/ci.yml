name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test (offline, uses committed data/processed)
        run: pytest -q

      - name: Forecasts, charts and findings are up to date
        run: |
          python models/run.py
          python findings/build.py
          git diff --exit-code -- models charts findings README.md
