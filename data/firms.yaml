# The six firms in the report and where their SEC data lives.
#
# cik:            SEC company IDs for 10-K / 10-Q results (company facts API).
#                 A list means the firm changed ID; older IDs first.
# thirteenf_cik:  SEC IDs that file the firm's 13F holdings. Older IDs first.
# revenue_tags:   XBRL revenue tags in priority order. The first tag with a
#                 value for a period wins, so like is compared with like.
#
# Notes
# - BlackRock moved to a new holding company in late 2024 (GIP deal). The old
#   company was renamed BlackRock Finance, Inc. and keeps ID 1364742.
# - Vanguard is private: no 10-K or 10-Q, so no revenue or profit. It is judged
#   on its own published AUM (data/manual/vanguard_aum.csv) and its 13F filings.
#   From Q1 2026 Vanguard files only 13F-NT notices (other Vanguard entities now
#   report its holdings). The 2015-2025 history ends with its Q4 2025 13F-HR.

firms:
  jpmorgan:
    name: JPMorgan Chase
    short: JPMorgan
    ticker: JPM
    group: bank
    cik: [19617]
    revenue_tags: [RevenuesNetOfInterestExpense, Revenues]

  goldman:
    name: Goldman Sachs
    short: Goldman
    ticker: GS
    group: bank
    cik: [886982]
    revenue_tags: [RevenuesNetOfInterestExpense]

  morgan_stanley:
    name: Morgan Stanley
    short: Morgan Stanley
    ticker: MS
    group: bank
    cik: [895421]
    revenue_tags: [RevenuesNetOfInterestExpense, Revenues]

  blackrock:
    name: BlackRock
    short: BlackRock
    ticker: BLK
    group: fund_manager
    cik: [1364742, 2012383]
    thirteenf_cik: [1364742, 2012383]
    # Until Q4 2016 BlackRock's main subsidiaries filed their own 13Fs; from
    # Q1 2017 BlackRock, Inc. files one combined report. For 2015-2016 we add
    # these up: Advisors, Fund Advisors, Group Ltd, Institutional Trust Co,
    # Investment Management LLC and Japan.
    thirteenf_parts_until: 2016-12-31
    thirteenf_parts_cik: [1086364, 1006249, 1003283, 913414, 1305227, 1085635]
    revenue_tags:
      - Revenues
      - RevenueFromContractWithCustomerExcludingAssessedTax
      - RevenuesExcludingInterestAndDividends

  vanguard:
    name: Vanguard
    short: Vanguard
    ticker: null
    group: fund_manager
    cik: []
    thirteenf_cik: [102909]
    revenue_tags: []

  state_street:
    name: State Street
    short: State Street
    ticker: STT
    group: fund_manager
    cik: [93751]
    thirteenf_cik: [93751]
    revenue_tags: [Revenues]

period:
  start: 2015-01-01
  end: 2025-12-31

fred_series:
  DFF: Federal funds effective rate (daily, %)
  DGS2: 2-year Treasury yield (daily, %)
  DGS10: 10-year Treasury yield (daily, %)
  T10Y2Y: 10-year minus 2-year Treasury spread (daily, percentage points)
  VIXCLS: CBOE VIX volatility index (daily)
  NASDAQCOM: Nasdaq Composite index (daily)
  SP500: S&P 500 index (daily; FRED only shares the last 10 years)
  BOGZ1LM883164115Q: US public company shares, total market value (Fed Z.1, quarterly, $ millions)
